name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [typecheck, test]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache GTFS static data
        if: matrix.task == 'test'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            packages/server/src/data/gtfs
            packages/server/src/data/gtfs-lirr
          key: gtfs-static-v3-subway-lirr-schedule

      - name: Download GTFS data if not cached
        if: matrix.task == 'test'
        run: |
          if [ ! -f packages/server/src/data/gtfs/stops.json ]; then
            pnpm download-gtfs
          fi
          if [ ! -f packages/server/src/data/gtfs-lirr/stops.json ]; then
            pnpm download-gtfs:lirr
          fi

      - run: pnpm ${{ matrix.task }}

  e2e:
    name: e2e (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    strategy:
      # One shard's failure shouldn't kill the other — still want to see
      # both reports.
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache GTFS static data
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            packages/server/src/data/gtfs
            packages/server/src/data/gtfs-lirr
          key: gtfs-static-v3-subway-lirr-schedule

      - name: Download GTFS data if not cached
        run: |
          if [ ! -f packages/server/src/data/gtfs/stops.json ]; then
            pnpm download-gtfs
          fi
          if [ ! -f packages/server/src/data/gtfs-lirr/stops.json ]; then
            pnpm download-gtfs:lirr
          fi

      - name: Resolve installed Playwright version
        id: playwright-version
        run: |
          version=$(pnpm --filter @panoptrain/e2e exec node -p "require('@playwright/test/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-chromium-webkit

      - name: Install Playwright browsers (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @panoptrain/e2e exec playwright install --with-deps chromium webkit

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @panoptrain/e2e exec playwright install-deps chromium webkit

      # Playwright's built-in sharding splits the test set evenly. Each
      # shard runs in its own GH runner job in parallel — wall-clock
      # roughly = single-runner-time / shard-count, at the cost of N×
      # runner minutes consumed.
      #
      # Calling playwright directly via `pnpm exec` (rather than
      # `pnpm test:e2e -- --shard=...`) avoids a pnpm double-script-layer
      # quirk where the `--` was forwarded as a literal arg, making
      # playwright treat `--shard=N/M` as a positional test-file path
      # and bail with "No tests found".
      - run: pnpm --filter @panoptrain/e2e exec playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload e2e results JSON
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Per-shard suffix so the two upload steps don't collide. The
          # profile:flakes script walks subdirectories under flake-runs/
          # so multiple result files per CI run aggregate naturally.
          name: e2e-results-json-shard-${{ matrix.shard }}
          path: packages/e2e/test-results/results.json
          retention-days: 14
          if-no-files-found: warn

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: packages/e2e/playwright-report/
          retention-days: 7
