# Weekly grouped dependency updates. Per CLAUDE.md repo standards:
# grouped updates so a single weekly PR rolls patch+minor for all deps
# rather than spamming the queue.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    groups:
      # Roll all patch+minor bumps into one PR per ecosystem per week.
      # Majors stay on their own so they get reviewed individually —
      # major bumps tend to have breaking changes worth scrutinizing.
      npm-patch-minor:
        update-types:
          - "patch"
          - "minor"
    ignore:
      # @types/node is held to the major version of our runtime Node.
      # Runtime is Node 22 (see Dockerfile); types ahead of runtime risk
      # silently typing Node 23+ stdlib APIs that crash on Node 22. CI
      # runs on Node 22 too, but coverage-gap paths could slip through.
      # Re-evaluate this cap when bumping the Dockerfile node base image.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    groups:
      gha-patch-minor:
        update-types:
          - "patch"
          - "minor"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
