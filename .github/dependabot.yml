# Weekly grouped dependency updates. Per CLAUDE.md repo standards:
# grouped updates so a single weekly PR rolls patch+minor for all deps
# rather than spamming the queue.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    groups:
      # Roll all patch+minor bumps into one PR per ecosystem per week.
      # Majors stay on their own so they get reviewed individually —
      # major bumps tend to have breaking changes worth scrutinizing.
      npm-patch-minor:
        update-types:
          - "patch"
          - "minor"
    ignore:
      # Block further @types/node major bumps. The runtime is Node 22
      # (Dockerfile and CI), but @types/node is already at 26: #78 bumped
      # it 22 -> 26 and was merged the same day #94 added this cap, so the
      # cap only holds the gap where it is rather than closing it. Types
      # ahead of runtime can silently type Node 23+ stdlib APIs that throw
      # on Node 22; typecheck and CI won't catch a call on a path tests
      # miss. To close the gap either pin @types/node back to ^22 or bump
      # the Dockerfile/CI runtime to match, then re-evaluate this cap.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Tracks the digest-pinned FROM in the Dockerfile. Without this the base
  # image is never updated at all — a tag pin drifts silently and a digest pin
  # freezes forever, so either way it needs an explicit updater.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(infra)"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    groups:
      gha-patch-minor:
        update-types:
          - "patch"
          - "minor"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
